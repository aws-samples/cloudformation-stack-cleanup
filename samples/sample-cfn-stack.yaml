AWSTemplateFormatVersion: '2010-09-09'
Description: Sample CloudFormation stack with a Security Group, S3 Bucket with an access log bucket, and DynamoDB Table encrypted with a customer managed KMS key and with deletion protection enabled.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The ID of the VPC where the security group will be created.

Resources:
  # Security Group with no inbound rules
  SampleSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group with no inbound or outbound rules
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/24
          Description: Allow outbound HTTPS traffic to 10.0.0.0/24

  # S3 Bucket for server access logs of SampleS3Bucket
  SampleS3LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sampleforcleanup-access-logs-${AWS::Region}-${AWS::AccountId}
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256  # Server access log destination buckets must use SSE-S3
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "This bucket is the server access log destination. Delivering its logs to itself causes an infinite loop of logs."
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "This bucket is the server access log destination. Delivering its logs to itself causes an infinite loop of logs."
      guard:
        # S3_BUCKET_LOGGING_ENABLED: this bucket is the server access log destination.
        # S3_BUCKET_DEFAULT_LOCK_ENABLED: buckets with S3 Object Lock enabled can't be used as server access log destinations.
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_DEFAULT_LOCK_ENABLED

  SampleS3LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SampleS3LogBucket
      PolicyDocument:
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: "s3:PutObject"
            Resource: !Sub "${SampleS3LogBucket.Arn}/access-logs/*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::sample-s3-bucket-${AWS::Region}-${AWS::AccountId}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SampleS3LogBucket.Arn
              - !Sub "${SampleS3LogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # S3 Bucket
  SampleS3Bucket:
    Type: AWS::S3::Bucket
    DependsOn: SampleS3LogBucketPolicy
    Properties:
      BucketName: !Sub sample-s3-bucket-${AWS::Region}-${AWS::AccountId}
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref SampleS3LogBucket
        LogFilePrefix: access-logs/
      ObjectLockEnabled: true  # No default retention, so objects can still be deleted
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  SampleS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SampleS3Bucket
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SampleS3Bucket.Arn
              - !Sub "${SampleS3Bucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # Customer managed KMS key for the DynamoDB table
  SampleDynamoDBTableKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer managed key for the sample DynamoDB table
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  # DynamoDB Table with Deletion Protection
  SampleDynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub sampleforcleanup-MyDynamoDBTable-${AWS::Region}-${AWS::AccountId}
      AttributeDefinitions:
        - AttributeName: PrimaryKey
          AttributeType: S
        - AttributeName: SortKey
          AttributeType: N
      KeySchema:
        - AttributeName: PrimaryKey
          KeyType: HASH  # Partition key
        - AttributeName: SortKey
          KeyType: RANGE  # Sort key
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true  # Deletion protection enabled
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref SampleDynamoDBTableKey
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit table name is required for this resource."

