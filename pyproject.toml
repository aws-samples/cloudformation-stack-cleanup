[project]
name = "cfncli"
version = "0.1.0"
description = "Sample CLI that deletes AWS CloudFormation stacks and their associated resources"
authors = [{ name = "James Jacob" }, { name = "Sandeep Singh" }]
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.13,<4.0"
dependencies = [
    "boto3==1.43.127",
    "click==8.5.1",
    "click-log==0.4.0",
]

[project.scripts]
cfncli = "cfncli:start_cli"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-mock = "3.17.0"
moto = { version = "5.2.5", extras = ["cloudformation"] }
coverage = "7.17.2"
pip-audit = "2.10.1"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
